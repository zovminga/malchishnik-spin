<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>МАЛЬЧИШНИК — рулетка</title>
    <style>
      :root {
        --bg: #020805;
        --gold: #ffe566;
        --pink: #ff1493;
        --cyan: #00fff0;
        --lime: #b8ff00;
        --red: #ff003c;
        --ink: #fff8e7;
        --muted: #c8d4c8;
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        margin: 0;
        min-height: 100%;
        background: #000;
        color: var(--ink);
        font-family: Impact, Haettenschweiler, 'Arial Narrow Bold', sans-serif;
      }

      body {
        min-height: 100svh;
        overflow-x: hidden;
      }

      .felt {
        position: fixed;
        inset: 0;
        z-index: -3;
        background:
          radial-gradient(ellipse 80% 55% at 50% 30%, #1a7a3c 0%, transparent 55%),
          radial-gradient(circle at 20% 80%, rgba(255, 20, 147, 0.35), transparent 35%),
          radial-gradient(circle at 80% 70%, rgba(0, 255, 240, 0.28), transparent 35%),
          linear-gradient(160deg, #0a3d22 0%, #020805 50%, #120018 100%);
        animation: felt-shift 8s ease-in-out infinite alternate;
      }

      .scanlines {
        position: fixed;
        inset: 0;
        z-index: 20;
        pointer-events: none;
        background: repeating-linear-gradient(
          to bottom,
          transparent 0,
          transparent 2px,
          rgba(0, 0, 0, 0.12) 2px,
          rgba(0, 0, 0, 0.12) 4px
        );
        mix-blend-mode: multiply;
        opacity: 0.35;
      }

      .grid {
        position: fixed;
        inset: -20%;
        z-index: -2;
        background-image:
          linear-gradient(rgba(0, 255, 240, 0.09) 1px, transparent 1px),
          linear-gradient(90deg, rgba(255, 20, 147, 0.08) 1px, transparent 1px);
        background-size: 40px 40px;
        transform: perspective(400px) rotateX(55deg);
        transform-origin: center top;
        animation: grid-zoom 10s linear infinite;
        mask-image: linear-gradient(to bottom, black, transparent 75%);
        pointer-events: none;
      }

      .blob {
        position: fixed;
        width: 40vmax;
        height: 40vmax;
        border-radius: 50%;
        filter: blur(60px);
        opacity: 0.45;
        z-index: -1;
        pointer-events: none;
        mix-blend-mode: screen;
      }

      .blob-a {
        top: -10%;
        left: -10%;
        background: var(--pink);
        animation: blob-a 7s ease-in-out infinite;
      }

      .blob-b {
        bottom: -15%;
        right: -10%;
        background: var(--cyan);
        animation: blob-b 9s ease-in-out infinite;
      }

      .blob-c {
        top: 40%;
        left: 50%;
        width: 30vmax;
        height: 30vmax;
        background: var(--lime);
        opacity: 0.2;
        animation: blob-c 6s ease-in-out infinite;
      }

      .page {
        position: relative;
        min-height: 100svh;
        display: flex;
        flex-direction: column;
        align-items: center;
        padding: 1rem 0.85rem 2rem;
      }

      .page.flash::before {
        content: '';
        position: fixed;
        inset: 0;
        background: radial-gradient(circle at 50% 40%, #fff 0%, var(--gold) 20%, transparent 60%);
        pointer-events: none;
        animation: flash-burst 0.7s steps(2) forwards;
        z-index: 15;
      }

      .ticker {
        width: 100vw;
        overflow: hidden;
        background: #000;
        border-block: 3px solid var(--gold);
        margin: 0 0 0.75rem;
        box-shadow: 0 0 20px var(--pink);
      }

      .ticker-track {
        display: flex;
        width: max-content;
        gap: 2rem;
        padding: 0.35rem 0;
        animation: ticker 12s linear infinite;
        font-size: 0.85rem;
        letter-spacing: 0.12em;
        color: var(--lime);
        text-transform: uppercase;
        font-family: system-ui, sans-serif;
        font-weight: 800;
      }

      .ticker span {
        white-space: nowrap;
      }

      .ticker span:nth-child(odd) {
        color: var(--cyan);
      }

      .ticker span:nth-child(3n) {
        color: var(--pink);
      }

      .hero {
        width: min(100%, 42rem);
        display: flex;
        flex-direction: column;
        align-items: center;
        text-align: center;
        gap: 0.55rem;
      }

      .brand-wrap {
        position: relative;
        margin: 0.2rem 0;
      }

      .brand {
        margin: 0;
        font-size: clamp(2.6rem, 13vw, 5.6rem);
        line-height: 0.9;
        letter-spacing: 0.02em;
        text-transform: uppercase;
        color: var(--gold);
        text-shadow:
          4px 0 var(--pink),
          -4px 0 var(--cyan),
          0 0 18px var(--gold),
          0 0 40px var(--pink);
        animation: brand-glitch 2.4s infinite;
      }

      .brand::before,
      .brand::after {
        content: attr(data-text);
        position: absolute;
        inset: 0;
        overflow: hidden;
      }

      .brand::before {
        color: var(--cyan);
        clip-path: inset(0 0 55% 0);
        transform: translate(-3px, -1px);
        animation: glitch-top 2.1s infinite linear alternate-reverse;
      }

      .brand::after {
        color: var(--pink);
        clip-path: inset(45% 0 0 0);
        transform: translate(3px, 1px);
        animation: glitch-bot 1.7s infinite linear alternate-reverse;
      }

      h1 {
        margin: 0;
        font-size: clamp(1.2rem, 4.5vw, 2rem);
        font-weight: 400;
        letter-spacing: 0.04em;
        text-transform: uppercase;
        color: #fff;
        text-shadow: 0 0 12px var(--cyan), 2px 2px 0 #000;
        animation: hue-text 4s linear infinite;
      }

      .lede {
        margin: 0 0 0.25rem;
        max-width: 26rem;
        color: var(--muted);
        font-size: 1rem;
        line-height: 1.35;
        font-family: system-ui, sans-serif;
        font-weight: 600;
      }

      .roulette {
        width: min(100%, 26rem);
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 1.1rem;
        margin-top: 0.2rem;
      }

      .wheel-stage {
        position: relative;
        width: min(90vw, 24rem);
        aspect-ratio: 1;
        filter: drop-shadow(0 0 24px rgba(255, 20, 147, 0.55))
          drop-shadow(0 20px 40px rgba(0, 0, 0, 0.65));
        animation: stage-glow 2.5s ease-in-out infinite;
      }

      .wheel-stage.spinning {
        animation: stage-spin-pulse 0.35s linear infinite;
      }

      .wheel-stage.win {
        animation: win-boom 0.65s ease-out;
      }

      .rim-spin {
        position: absolute;
        inset: -8px;
        border-radius: 50%;
        border: 3px dashed var(--cyan);
        animation: rim-rotate 6s linear infinite;
        pointer-events: none;
        opacity: 0.7;
        box-shadow: 0 0 16px var(--cyan);
      }

      .rim-spin-2 {
        inset: -16px;
        border-style: dotted;
        border-color: var(--pink);
        animation-direction: reverse;
        animation-duration: 4s;
        box-shadow: 0 0 16px var(--pink);
      }

      .wheel {
        width: 100%;
        height: 100%;
        border-radius: 50%;
        will-change: transform;
      }

      .wheel svg {
        width: 100%;
        height: 100%;
        display: block;
      }

      .pointer {
        position: absolute;
        top: -0.5rem;
        left: 50%;
        z-index: 3;
        width: 0;
        height: 0;
        transform: translateX(-50%);
        border-left: 16px solid transparent;
        border-right: 16px solid transparent;
        border-top: 34px solid var(--gold);
        filter: drop-shadow(0 0 8px var(--gold)) drop-shadow(0 3px 4px #000);
        animation: pointer-bounce 0.8s ease-in-out infinite;
      }

      .pointer::after {
        content: '';
        position: absolute;
        top: -34px;
        left: -8px;
        width: 16px;
        height: 16px;
        background: #fff;
        border-radius: 50%;
        box-shadow: 0 0 14px var(--gold);
      }

      .spin-btn {
        appearance: none;
        border: 4px solid var(--gold);
        background: linear-gradient(90deg, var(--pink), var(--red), #ff6a00, var(--pink));
        background-size: 300% 100%;
        color: #fff;
        font-family: Impact, Haettenschweiler, sans-serif;
        font-size: clamp(1.15rem, 4vw, 1.55rem);
        letter-spacing: 0.08em;
        padding: 1rem 1.5rem;
        min-width: min(100%, 19rem);
        cursor: pointer;
        text-transform: uppercase;
        box-shadow:
          0 0 0 4px #000,
          0 10px 0 #5c0820,
          0 0 30px var(--pink),
          0 0 60px rgba(255, 230, 0, 0.35);
        animation: btn-flow 2s linear infinite, btn-thump 1.1s ease-in-out infinite;
        transition: transform 0.1s;
      }

      .spin-btn:hover:not(:disabled) {
        transform: scale(1.04) translateY(-2px);
        filter: brightness(1.15);
      }

      .spin-btn:active:not(:disabled) {
        transform: translateY(6px) scale(0.98);
        box-shadow:
          0 0 0 4px #000,
          0 3px 0 #5c0820,
          0 0 20px var(--pink);
        animation: btn-flow 2s linear infinite;
      }

      .spin-btn:disabled {
        cursor: wait;
        filter: saturate(1.2) brightness(1.1);
      }

      .result {
        min-height: 5.8rem;
        width: min(100%, 28rem);
        margin-top: 0.2rem;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 0.2rem;
        font-family: system-ui, sans-serif;
      }

      .result-kicker {
        margin: 0;
        font-size: 0.9rem;
        font-weight: 900;
        letter-spacing: 0.35em;
        color: var(--cyan);
        text-shadow: 0 0 10px var(--cyan);
        animation: blink 0.55s steps(2) infinite;
      }

      .result-label {
        margin: 0;
        font-family: Impact, Haettenschweiler, sans-serif;
        font-size: clamp(2.4rem, 10vw, 4rem);
        line-height: 0.95;
        letter-spacing: 0.02em;
        text-shadow:
          3px 0 var(--cyan),
          -3px 0 var(--pink),
          0 0 20px currentColor;
        animation: result-slam 0.5s cubic-bezier(0.2, 1.6, 0.4, 1);
      }

      .result-tagline {
        margin: 0.25rem 0 0;
        max-width: 26rem;
        color: var(--ink);
        font-size: 1rem;
        font-weight: 700;
        line-height: 1.35;
      }

      .result-placeholder {
        margin: 0.7rem 0 0;
        color: var(--lime);
        font-size: 1.05rem;
        font-weight: 800;
        letter-spacing: 0.06em;
        text-transform: uppercase;
        text-shadow: 0 0 10px var(--lime);
        animation: blink 1.2s steps(2) infinite;
      }

      .history {
        width: min(100%, 28rem);
        margin-top: 1.75rem;
        text-align: left;
        font-family: system-ui, sans-serif;
      }

      .history h2 {
        margin: 0 0 0.65rem;
        font-size: 0.95rem;
        letter-spacing: 0.14em;
        color: var(--gold);
        font-weight: 900;
        text-transform: uppercase;
        text-shadow: 0 0 8px var(--gold);
      }

      .history ol {
        margin: 0;
        padding: 0;
        list-style: none;
        display: flex;
        flex-direction: column;
        gap: 0.4rem;
      }

      .history li {
        display: flex;
        align-items: center;
        gap: 0.55rem;
        font-weight: 800;
        letter-spacing: 0.04em;
        animation: slide-in 0.35s ease-out;
      }

      .dot {
        width: 0.75rem;
        height: 0.75rem;
        border-radius: 50%;
        flex-shrink: 0;
        box-shadow: 0 0 10px currentColor;
      }

      .footer {
        margin-top: auto;
        padding-top: 2rem;
        color: rgba(200, 212, 200, 0.75);
        font-size: 0.8rem;
        text-align: center;
        font-family: system-ui, sans-serif;
        font-weight: 600;
      }

      .footer p {
        margin: 0;
      }

      .fx-layer {
        position: fixed;
        inset: 0;
        pointer-events: none;
        z-index: 12;
        overflow: hidden;
      }

      .spark {
        position: absolute;
        width: 8px;
        height: 8px;
        border-radius: 1px;
        animation: spark-fly 0.9s ease-out forwards;
      }

      @keyframes felt-shift {
        from {
          filter: hue-rotate(0deg);
        }
        to {
          filter: hue-rotate(25deg);
        }
      }

      @keyframes grid-zoom {
        from {
          background-position: 0 0, 0 0;
          opacity: 0.7;
        }
        to {
          background-position: 0 80px, 40px 0;
          opacity: 1;
        }
      }

      @keyframes blob-a {
        0%,
        100% {
          transform: translate(0, 0) scale(1);
        }
        50% {
          transform: translate(12vw, 8vh) scale(1.2);
        }
      }

      @keyframes blob-b {
        0%,
        100% {
          transform: translate(0, 0) scale(1.1);
        }
        50% {
          transform: translate(-10vw, -6vh) scale(0.9);
        }
      }

      @keyframes blob-c {
        0%,
        100% {
          transform: translate(-50%, -50%) scale(1);
        }
        50% {
          transform: translate(-40%, -60%) scale(1.3);
        }
      }

      @keyframes ticker {
        from {
          transform: translateX(0);
        }
        to {
          transform: translateX(-50%);
        }
      }

      @keyframes brand-glitch {
        0%,
        90%,
        100% {
          transform: none;
          filter: none;
        }
        92% {
          transform: translate(-2px, 1px) skewX(-2deg);
          filter: hue-rotate(40deg);
        }
        94% {
          transform: translate(3px, -1px);
        }
        96% {
          transform: translate(-1px, 2px) skewX(2deg);
        }
      }

      @keyframes glitch-top {
        0%,
        100% {
          transform: translate(-2px, -1px);
        }
        50% {
          transform: translate(3px, 1px);
        }
      }

      @keyframes glitch-bot {
        0%,
        100% {
          transform: translate(2px, 1px);
        }
        50% {
          transform: translate(-3px, -1px);
        }
      }

      @keyframes hue-text {
        from {
          filter: hue-rotate(0deg);
        }
        to {
          filter: hue-rotate(360deg);
        }
      }

      @keyframes stage-glow {
        0%,
        100% {
          filter: drop-shadow(0 0 18px rgba(255, 20, 147, 0.45))
            drop-shadow(0 20px 40px rgba(0, 0, 0, 0.65));
        }
        50% {
          filter: drop-shadow(0 0 36px rgba(0, 255, 240, 0.7))
            drop-shadow(0 20px 40px rgba(0, 0, 0, 0.65));
        }
      }

      @keyframes stage-spin-pulse {
        0%,
        100% {
          filter: drop-shadow(0 0 20px var(--pink)) drop-shadow(0 0 40px var(--cyan));
        }
        50% {
          filter: drop-shadow(0 0 40px var(--gold)) drop-shadow(0 0 60px var(--lime));
        }
      }

      @keyframes rim-rotate {
        to {
          transform: rotate(360deg);
        }
      }

      @keyframes pointer-bounce {
        0%,
        100% {
          transform: translateX(-50%) translateY(0);
        }
        50% {
          transform: translateX(-50%) translateY(4px);
        }
      }

      @keyframes btn-flow {
        to {
          background-position: 300% 0;
        }
      }

      @keyframes btn-thump {
        0%,
        100% {
          transform: scale(1);
        }
        50% {
          transform: scale(1.03);
        }
      }

      @keyframes blink {
        50% {
          opacity: 0.25;
        }
      }

      @keyframes result-slam {
        0% {
          transform: scale(2.4) rotate(-6deg);
          opacity: 0;
          filter: blur(6px);
        }
        100% {
          transform: scale(1) rotate(0);
          opacity: 1;
          filter: none;
        }
      }

      @keyframes win-boom {
        0% {
          transform: scale(1);
        }
        30% {
          transform: scale(1.08) rotate(-2deg);
        }
        55% {
          transform: scale(0.96) rotate(2deg);
        }
        100% {
          transform: scale(1);
        }
      }

      @keyframes flash-burst {
        0% {
          opacity: 0.95;
        }
        100% {
          opacity: 0;
        }
      }

      @keyframes spark-fly {
        0% {
          transform: translate(0, 0) scale(1) rotate(0);
          opacity: 1;
        }
        100% {
          transform: translate(var(--dx), var(--dy)) scale(0) rotate(180deg);
          opacity: 0;
        }
      }

      @keyframes slide-in {
        from {
          transform: translateX(-12px);
          opacity: 0;
        }
        to {
          transform: translateX(0);
          opacity: 1;
        }
      }

      @media (max-width: 480px) {
        .spin-btn {
          width: 100%;
        }
      }

      @media (prefers-reduced-motion: reduce) {
        *,
        *::before,
        *::after {
          animation-duration: 0.01ms !important;
          animation-iteration-count: 1 !important;
          transition-duration: 0.01ms !important;
        }
      }
    </style>
  </head>
  <body>
    <div class="felt" aria-hidden="true"></div>
    <div class="grid" aria-hidden="true"></div>
    <div class="blob blob-a" aria-hidden="true"></div>
    <div class="blob blob-b" aria-hidden="true"></div>
    <div class="blob blob-c" aria-hidden="true"></div>
    <div class="scanlines" aria-hidden="true"></div>
    <div class="fx-layer" id="fx" aria-hidden="true"></div>

    <div class="page" id="page">
      <div class="ticker" aria-hidden="true">
        <div class="ticker-track">
          <span>КАЗИНО</span><span>•</span><span>БАР</span><span>•</span>
          <span>СТРИПУХА</span><span>•</span><span>KC GRAD</span><span>•</span>
          <span>КОМПЫ</span><span>•</span><span>КРУТИ</span><span>•</span>
          <span>КАЗИНО</span><span>•</span><span>БАР</span><span>•</span>
          <span>СТРИПУХА</span><span>•</span><span>KC GRAD</span><span>•</span>
          <span>КОМПЫ</span><span>•</span><span>КРУТИ</span><span>•</span>
        </div>
      </div>

      <main class="hero">
        <div class="brand-wrap">
          <p class="brand" data-text="МАЛЬЧИШНИК">МАЛЬЧИШНИК</p>
        </div>
        <h1>Куда идём дальше?</h1>
        <p class="lede">Один спин — один адрес. Переигрывать нельзя.</p>

        <div class="roulette">
          <div class="wheel-stage" id="stage">
            <div class="rim-spin" aria-hidden="true"></div>
            <div class="rim-spin rim-spin-2" aria-hidden="true"></div>
            <div class="pointer" aria-hidden="true"></div>
            <div class="wheel" id="wheel" aria-label="Рулетка мест"></div>
          </div>
          <button type="button" class="spin-btn" id="spinBtn">КРУТИТЬ</button>
        </div>

        <div class="result" id="result" aria-live="polite">
          <p class="result-placeholder">Жми кнопку</p>
        </div>
      </main>

      <section class="history" id="history" hidden>
        <h2>Уже было</h2>
        <ol id="historyList"></ol>
      </section>

      <footer class="footer">
        <p>Решение за рулеткой. Не спорь с колесом.</p>
      </footer>
    </div>

    <script>
      const DESTINATIONS = [
        {
          id: 'casino',
          label: 'КАЗИНО',
          tagline: 'Стол, фишки, минус депозит.',
          color: '#ff003c',
          text: '#fff8e7',
        },
        {
          id: 'bar',
          label: 'БАР',
          tagline: 'Шоты по кругу. Без обсуждений.',
          color: '#1a6bff',
          text: '#f0f7ff',
        },
        {
          id: 'strip',
          label: 'СТРИПУХА',
          tagline: 'Неон, дым, нулевая память.',
          color: '#ff1493',
          text: '#fff0f5',
        },
        {
          id: 'kc',
          label: 'KC GRAD',
          tagline: 'Выпало — едем. Точка.',
          color: '#b8ff00',
          text: '#04150a',
        },
        {
          id: 'comps',
          label: 'КОМПЫ',
          tagline: 'Интернет-клуб. Реванш обязателен.',
          color: '#ff9f1a',
          text: '#1a0d00',
        },
      ]

      const SPIN_MS = 5600
      const MIN_TURNS = 7
      const slice = 360 / DESTINATIONS.length

      const wheelEl = document.getElementById('wheel')
      const stageEl = document.getElementById('stage')
      const btn = document.getElementById('spinBtn')
      const resultEl = document.getElementById('result')
      const pageEl = document.getElementById('page')
      const historySection = document.getElementById('history')
      const historyList = document.getElementById('historyList')
      const fx = document.getElementById('fx')

      let rotation = 0
      let spinning = false
      const history = []

      function polar(cx, cy, r, angleDeg) {
        const rad = ((angleDeg - 90) * Math.PI) / 180
        return { x: cx + r * Math.cos(rad), y: cy + r * Math.sin(rad) }
      }

      function slicePath(cx, cy, r, startAngle, endAngle) {
        const start = polar(cx, cy, r, endAngle)
        const end = polar(cx, cy, r, startAngle)
        const large = endAngle - startAngle <= 180 ? 0 : 1
        return `M ${cx} ${cy} L ${start.x} ${start.y} A ${r} ${r} 0 ${large} 0 ${end.x} ${end.y} Z`
      }

      function renderWheel() {
        const bulbs = Array.from({ length: 28 }, (_, i) => {
          const a = (i / 28) * 360
          const p = polar(200, 200, 194, a)
          const fill = i % 3 === 0 ? '#ffe566' : i % 3 === 1 ? '#00fff0' : '#ff1493'
          return `<circle class="bulb" cx="${p.x}" cy="${p.y}" r="4" fill="${fill}">
            <animate attributeName="opacity" values="1;0.25;1" dur="${0.4 + (i % 5) * 0.15}s" repeatCount="indefinite" begin="${(i % 7) * 0.08}s"/>
          </circle>`
        }).join('')

        const segments = DESTINATIONS.map((d, i) => {
          const start = i * slice
          const end = start + slice
          const mid = start + slice / 2
          const label = polar(200, 200, 118, mid)
          return `
            <g>
              <path d="${slicePath(200, 200, 190, start, end)}" fill="${d.color}" stroke="#050a08" stroke-width="3" />
              <text
                x="${label.x}" y="${label.y}"
                fill="${d.text}" font-size="19" font-family="Impact, Haettenschweiler, sans-serif"
                text-anchor="middle" dominant-baseline="middle"
                transform="rotate(${mid}, ${label.x}, ${label.y})"
              >${d.label}</text>
            </g>`
        }).join('')

        wheelEl.innerHTML = `
          <svg viewBox="0 0 400 400" role="img" aria-label="Рулетка мест">
            <defs>
              <radialGradient id="hub" cx="50%" cy="50%" r="50%">
                <stop offset="0%" stop-color="#fff6b0"/>
                <stop offset="55%" stop-color="#ffe566"/>
                <stop offset="100%" stop-color="#c49200"/>
              </radialGradient>
            </defs>
            <circle cx="200" cy="200" r="198" fill="#050a08" />
            ${segments}
            <circle cx="200" cy="200" r="190" fill="none" stroke="#ffe566" stroke-width="9" />
            <circle cx="200" cy="200" r="176" fill="none" stroke="#ff1493" stroke-width="2" opacity="0.8" />
            ${bulbs}
            <circle cx="200" cy="200" r="46" fill="#050a08" stroke="#ffe566" stroke-width="7" />
            <circle cx="200" cy="200" r="30" fill="url(#hub)" />
            <text x="200" y="207" text-anchor="middle" font-family="Impact,sans-serif" font-size="13" fill="#1a0d00">SPIN</text>
          </svg>`
      }

      function burst(color) {
        const colors = [color, '#ffe566', '#00fff0', '#ff1493', '#b8ff00', '#fff']
        for (let i = 0; i < 42; i++) {
          const el = document.createElement('i')
          el.className = 'spark'
          const angle = Math.random() * Math.PI * 2
          const dist = 80 + Math.random() * 220
          el.style.left = '50%'
          el.style.top = '42%'
          el.style.background = colors[i % colors.length]
          el.style.setProperty('--dx', `${Math.cos(angle) * dist}px`)
          el.style.setProperty('--dy', `${Math.sin(angle) * dist}px`)
          el.style.width = `${6 + Math.random() * 10}px`
          el.style.height = `${6 + Math.random() * 10}px`
          fx.appendChild(el)
          window.setTimeout(() => el.remove(), 950)
        }
      }

      function showResult(dest) {
        resultEl.innerHTML = `
          <p class="result-kicker">ВЫПАЛО</p>
          <p class="result-label" style="color:${dest.color}">${dest.label}</p>
          <p class="result-tagline">${dest.tagline}</p>`

        history.unshift(dest)
        if (history.length > 8) history.length = 8
        historySection.hidden = false
        historyList.innerHTML = history
          .map(
            (item) =>
              `<li><span class="dot" style="background:${item.color};color:${item.color}"></span>${item.label}</li>`,
          )
          .join('')

        pageEl.classList.remove('flash')
        void pageEl.offsetWidth
        pageEl.classList.add('flash')
        stageEl.classList.remove('win', 'spinning')
        void stageEl.offsetWidth
        stageEl.classList.add('win')
        burst(dest.color)
      }

      function spin() {
        if (spinning) return
        spinning = true
        btn.disabled = true
        btn.textContent = 'КРУТИТСЯ…'
        stageEl.classList.add('spinning')
        stageEl.classList.remove('win')
        resultEl.innerHTML = '<p class="result-placeholder">Крутится…</p>'

        const index = Math.floor(Math.random() * DESTINATIONS.length)
        const segmentCenter = index * slice + slice / 2
        const jitter = (Math.random() - 0.5) * (slice * 0.5)
        const targetMod = (360 - segmentCenter + jitter + 360) % 360
        const currentMod = ((rotation % 360) + 360) % 360
        const delta =
          ((targetMod - currentMod + 360) % 360) +
          MIN_TURNS * 360 +
          Math.floor(Math.random() * 360)

        rotation += delta
        wheelEl.style.transition = `transform ${SPIN_MS}ms cubic-bezier(0.1, 0.7, 0.05, 1)`
        wheelEl.style.transform = `rotate(${rotation}deg)`

        window.setTimeout(() => {
          spinning = false
          btn.disabled = false
          btn.textContent = 'КРУТИТЬ'
          showResult(DESTINATIONS[index])
        }, SPIN_MS)
      }

      renderWheel()
      btn.addEventListener('click', spin)
    </script>
  </body>
</html>
