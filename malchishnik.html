<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <meta name="color-scheme" content="dark" />
    <title>МАЛЬЧИШНИК — рулетка</title>
    <style>
      :root {
        --gold: #ffe566;
        --pink: #ff1493;
        --cyan: #00fff0;
        --lime: #b8ff00;
        --red: #ff003c;
        --ink: #fff8e7;
        --muted: #c8d4c8;
        --bg: #04150c;
      }

      * {
        box-sizing: border-box;
        -webkit-tap-highlight-color: transparent;
      }

      html,
      body {
        margin: 0;
        min-height: 100%;
        background: var(--bg);
        color: var(--ink);
        font-family: system-ui, -apple-system, 'Segoe UI', sans-serif;
      }

      body {
        min-height: 100vh;
        min-height: 100dvh;
        overflow-x: hidden;
      }

      .bg {
        position: fixed;
        inset: 0;
        z-index: 0;
        background:
          radial-gradient(ellipse 90% 60% at 50% 20%, #1f8a45 0%, transparent 55%),
          radial-gradient(circle at 15% 85%, rgba(255, 20, 147, 0.45), transparent 40%),
          radial-gradient(circle at 85% 75%, rgba(0, 255, 240, 0.35), transparent 40%),
          linear-gradient(165deg, #0b3d22 0%, #04150c 55%, #1a0030 100%);
      }

      .page {
        position: relative;
        z-index: 1;
        min-height: 100vh;
        min-height: 100dvh;
        display: flex;
        flex-direction: column;
        align-items: center;
        padding: 0.75rem 0.85rem 1.75rem;
        padding-bottom: calc(1.75rem + env(safe-area-inset-bottom, 0px));
      }

      .page.flash::after {
        content: '';
        position: fixed;
        inset: 0;
        background: rgba(255, 229, 102, 0.55);
        pointer-events: none;
        animation: flash 0.45s linear forwards;
        z-index: 9;
      }

      .ticker {
        width: 100vw;
        margin: 0 0 0.85rem;
        overflow: hidden;
        background: #000;
        border-top: 3px solid var(--gold);
        border-bottom: 3px solid var(--gold);
      }

      .ticker-track {
        display: flex;
        width: max-content;
        gap: 1.25rem;
        padding: 0.4rem 0;
        animation: ticker 14s linear infinite;
        font-size: 0.8rem;
        font-weight: 800;
        letter-spacing: 0.1em;
        text-transform: uppercase;
        color: var(--lime);
      }

      .ticker span:nth-child(3n) {
        color: var(--cyan);
      }
      .ticker span:nth-child(4n) {
        color: var(--pink);
      }

      .hero {
        width: min(100%, 26rem);
        display: flex;
        flex-direction: column;
        align-items: center;
        text-align: center;
        gap: 0.45rem;
      }

      .brand {
        position: relative;
        margin: 0.15rem 0 0;
        font-size: clamp(2.2rem, 12vw, 4.5rem);
        line-height: 0.95;
        font-weight: 900;
        letter-spacing: 0.02em;
        text-transform: uppercase;
        color: var(--gold);
        text-shadow:
          3px 0 var(--pink),
          -3px 0 var(--cyan),
          0 0 16px rgba(255, 229, 102, 0.8);
        animation: brand-pulse 1.8s ease-in-out infinite;
      }

      h1 {
        margin: 0;
        font-size: clamp(1.15rem, 5vw, 1.7rem);
        font-weight: 900;
        letter-spacing: 0.03em;
        text-transform: uppercase;
        text-shadow: 0 0 10px var(--cyan);
      }

      .lede {
        margin: 0;
        color: var(--muted);
        font-size: 0.98rem;
        font-weight: 600;
        line-height: 1.35;
        max-width: 22rem;
      }

      .roulette {
        width: 100%;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 1rem;
        margin-top: 0.35rem;
      }

      .wheel-stage {
        position: relative;
        width: min(86vw, 22rem);
        aspect-ratio: 1 / 1;
      }

      .wheel-stage::before {
        content: '';
        position: absolute;
        inset: -10px;
        border-radius: 50%;
        border: 2px dashed var(--cyan);
        animation: spin-cw 8s linear infinite;
        opacity: 0.75;
      }

      .wheel-stage::after {
        content: '';
        position: absolute;
        inset: -18px;
        border-radius: 50%;
        border: 2px dotted var(--pink);
        animation: spin-ccw 5.5s linear infinite;
        opacity: 0.75;
      }

      .wheel-stage.spinning {
        animation: stage-pulse 0.28s linear infinite;
      }

      .wheel-stage.win {
        animation: win-pop 0.55s ease-out;
      }

      .pointer {
        position: absolute;
        top: -6px;
        left: 50%;
        z-index: 3;
        width: 0;
        height: 0;
        transform: translateX(-50%);
        border-left: 14px solid transparent;
        border-right: 14px solid transparent;
        border-top: 30px solid var(--gold);
        filter: drop-shadow(0 0 6px var(--gold));
        animation: pointer-bounce 0.7s ease-in-out infinite;
      }

      .wheel {
        width: 100%;
        height: 100%;
        border-radius: 50%;
        will-change: transform;
        box-shadow:
          0 0 0 6px var(--gold),
          0 0 24px rgba(255, 20, 147, 0.7),
          0 0 48px rgba(0, 255, 240, 0.35);
      }

      .wheel svg {
        width: 100%;
        height: 100%;
        display: block;
        border-radius: 50%;
      }

      .bulb {
        transform-origin: center;
        animation: bulb-blink 0.9s steps(2) infinite;
      }
      .bulb:nth-child(3n) {
        animation-delay: 0.15s;
      }
      .bulb:nth-child(4n) {
        animation-delay: 0.3s;
      }

      .spin-btn {
        appearance: none;
        -webkit-appearance: none;
        border: 4px solid var(--gold);
        border-radius: 4px;
        background: linear-gradient(90deg, #ff1493, #ff003c, #ff6a00, #ff1493);
        background-size: 240% 100%;
        color: #fff;
        font-size: clamp(1.2rem, 5vw, 1.6rem);
        font-weight: 900;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        padding: 1rem 1.25rem;
        width: min(100%, 20rem);
        min-height: 56px;
        cursor: pointer;
        box-shadow:
          0 0 0 3px #000,
          0 8px 0 #5c0820,
          0 0 28px rgba(255, 20, 147, 0.75);
        animation: btn-flow 2s linear infinite;
        touch-action: manipulation;
      }

      .spin-btn:active:not(:disabled) {
        transform: translateY(5px);
        box-shadow:
          0 0 0 3px #000,
          0 2px 0 #5c0820,
          0 0 18px rgba(255, 20, 147, 0.6);
      }

      .spin-btn:disabled {
        cursor: wait;
        opacity: 0.92;
      }

      .result {
        min-height: 5.5rem;
        width: 100%;
        margin-top: 0.15rem;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 0.2rem;
      }

      .result-kicker {
        margin: 0;
        font-size: 0.85rem;
        font-weight: 900;
        letter-spacing: 0.28em;
        color: var(--cyan);
        animation: blink 0.6s steps(2) infinite;
      }

      .result-label {
        margin: 0;
        font-size: clamp(2.2rem, 11vw, 3.6rem);
        font-weight: 900;
        line-height: 1;
        letter-spacing: 0.02em;
        text-shadow:
          2px 0 var(--cyan),
          -2px 0 var(--pink);
        animation: slam 0.4s cubic-bezier(0.2, 1.5, 0.4, 1);
      }

      .result-tagline {
        margin: 0.2rem 0 0;
        font-size: 1rem;
        font-weight: 700;
        line-height: 1.35;
        max-width: 22rem;
      }

      .result-placeholder {
        margin: 0.65rem 0 0;
        color: var(--lime);
        font-size: 1rem;
        font-weight: 900;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        animation: blink 1.1s steps(2) infinite;
      }

      .history {
        width: min(100%, 26rem);
        margin-top: 1.5rem;
        text-align: left;
      }

      .history h2 {
        margin: 0 0 0.55rem;
        font-size: 0.9rem;
        letter-spacing: 0.14em;
        color: var(--gold);
        font-weight: 900;
        text-transform: uppercase;
      }

      .history ol {
        margin: 0;
        padding: 0;
        list-style: none;
        display: flex;
        flex-direction: column;
        gap: 0.35rem;
      }

      .history li {
        display: flex;
        align-items: center;
        gap: 0.5rem;
        font-weight: 800;
      }

      .dot {
        width: 0.7rem;
        height: 0.7rem;
        border-radius: 50%;
        flex-shrink: 0;
      }

      .footer {
        margin-top: auto;
        padding-top: 1.75rem;
        color: rgba(200, 212, 200, 0.8);
        font-size: 0.78rem;
        font-weight: 600;
        text-align: center;
      }

      .footer p {
        margin: 0;
      }

      .fx {
        position: fixed;
        inset: 0;
        pointer-events: none;
        z-index: 8;
        overflow: hidden;
      }

      .spark {
        position: absolute;
        width: 8px;
        height: 8px;
        border-radius: 2px;
        animation: spark 0.85s ease-out forwards;
      }

      @keyframes ticker {
        to {
          transform: translateX(-50%);
        }
      }
      @keyframes brand-pulse {
        0%,
        100% {
          transform: scale(1);
        }
        50% {
          transform: scale(1.03);
        }
      }
      @keyframes spin-cw {
        to {
          transform: rotate(360deg);
        }
      }
      @keyframes spin-ccw {
        to {
          transform: rotate(-360deg);
        }
      }
      @keyframes pointer-bounce {
        0%,
        100% {
          transform: translateX(-50%) translateY(0);
        }
        50% {
          transform: translateX(-50%) translateY(3px);
        }
      }
      @keyframes bulb-blink {
        50% {
          opacity: 0.25;
        }
      }
      @keyframes btn-flow {
        to {
          background-position: 240% 0;
        }
      }
      @keyframes blink {
        50% {
          opacity: 0.3;
        }
      }
      @keyframes slam {
        from {
          transform: scale(1.8);
          opacity: 0;
        }
        to {
          transform: scale(1);
          opacity: 1;
        }
      }
      @keyframes win-pop {
        0% {
          transform: scale(1);
        }
        40% {
          transform: scale(1.06);
        }
        100% {
          transform: scale(1);
        }
      }
      @keyframes stage-pulse {
        0%,
        100% {
          box-shadow: 0 0 0 0 rgba(255, 20, 147, 0.2);
        }
        50% {
          box-shadow: 0 0 0 10px rgba(0, 255, 240, 0.15);
        }
      }
      @keyframes flash {
        from {
          opacity: 1;
        }
        to {
          opacity: 0;
        }
      }
      @keyframes spark {
        from {
          transform: translate(0, 0) scale(1);
          opacity: 1;
        }
        to {
          transform: translate(var(--dx), var(--dy)) scale(0);
          opacity: 0;
        }
      }

      @media (prefers-reduced-motion: reduce) {
        .ticker-track,
        .brand,
        .wheel-stage::before,
        .wheel-stage::after,
        .pointer,
        .bulb,
        .spin-btn,
        .result-kicker,
        .result-placeholder {
          animation: none !important;
        }
      }
    </style>
  </head>
  <body>
    <div class="bg" aria-hidden="true"></div>
    <div class="fx" id="fx" aria-hidden="true"></div>

    <div class="page" id="page">
      <div class="ticker" aria-hidden="true">
        <div class="ticker-track" id="ticker"></div>
      </div>

      <main class="hero">
        <p class="brand">МАЛЬЧИШНИК</p>
        <h1>Куда идём дальше?</h1>
        <p class="lede">Один спин — один адрес. Переигрывать нельзя.</p>

        <div class="roulette">
          <div class="wheel-stage" id="stage">
            <div class="pointer" aria-hidden="true"></div>
            <div class="wheel" id="wheel"></div>
          </div>
          <button type="button" class="spin-btn" id="spinBtn">КРУТИТЬ</button>
        </div>

        <div class="result" id="result" aria-live="polite">
          <p class="result-placeholder">Жми кнопку</p>
        </div>
      </main>

      <section class="history" id="history" hidden>
        <h2>Уже было</h2>
        <ol id="historyList"></ol>
      </section>

      <footer class="footer">
        <p>Решение за рулеткой. Не спорь с колесом.</p>
      </footer>
    </div>

    <script>
      (function () {
        var DESTINATIONS = [
          {
            id: 'casino',
            label: 'КАЗИНО',
            tagline: 'Стол, фишки, минус депозит.',
            color: '#ff003c',
            text: '#fff8e7',
          },
          {
            id: 'bar',
            label: 'БАР',
            tagline: 'Шоты по кругу. Без обсуждений.',
            color: '#1a6bff',
            text: '#f0f7ff',
          },
          {
            id: 'strip',
            label: 'СТРИПУХА',
            tagline: 'Неон, дым, нулевая память.',
            color: '#ff1493',
            text: '#fff0f5',
          },
          {
            id: 'kc',
            label: 'KC GRAD',
            tagline: 'Выпало — едем. Точка.',
            color: '#b8ff00',
            text: '#04150a',
          },
          {
            id: 'comps',
            label: 'КОМПЫ',
            tagline: 'Интернет-клуб. Реванш обязателен.',
            color: '#ff9f1a',
            text: '#1a0d00',
          },
        ]

        var SPIN_MS = 5600
        var MIN_TURNS = 7
        var slice = 360 / DESTINATIONS.length
        var rotation = 0
        var spinning = false
        var history = []

        var wheelEl = document.getElementById('wheel')
        var stageEl = document.getElementById('stage')
        var btn = document.getElementById('spinBtn')
        var resultEl = document.getElementById('result')
        var pageEl = document.getElementById('page')
        var historySection = document.getElementById('history')
        var historyList = document.getElementById('historyList')
        var fx = document.getElementById('fx')
        var ticker = document.getElementById('ticker')

        function polar(cx, cy, r, angleDeg) {
          var rad = ((angleDeg - 90) * Math.PI) / 180
          return { x: cx + r * Math.cos(rad), y: cy + r * Math.sin(rad) }
        }

        function slicePath(cx, cy, r, startAngle, endAngle) {
          var start = polar(cx, cy, r, endAngle)
          var end = polar(cx, cy, r, startAngle)
          var large = endAngle - startAngle <= 180 ? 0 : 1
          return (
            'M ' +
            cx +
            ' ' +
            cy +
            ' L ' +
            start.x +
            ' ' +
            start.y +
            ' A ' +
            r +
            ' ' +
            r +
            ' 0 ' +
            large +
            ' 0 ' +
            end.x +
            ' ' +
            end.y +
            ' Z'
          )
        }

        function esc(s) {
          return String(s)
            .replace(/&/g, '&amp;')
            .replace(/</g, '&lt;')
            .replace(/"/g, '&quot;')
        }

        function renderTicker() {
          var items = ['КАЗИНО', 'БАР', 'СТРИПУХА', 'KC GRAD', 'КОМПЫ', 'КРУТИ']
          var html = ''
          for (var loop = 0; loop < 2; loop++) {
            for (var i = 0; i < items.length; i++) {
              html += '<span>' + items[i] + '</span><span>•</span>'
            }
          }
          ticker.innerHTML = html
        }

        function renderWheel() {
          var bulbs = ''
          var i
          for (i = 0; i < 28; i++) {
            var a = (i / 28) * 360
            var p = polar(200, 200, 194, a)
            var fill = i % 3 === 0 ? '#ffe566' : i % 3 === 1 ? '#00fff0' : '#ff1493'
            bulbs +=
              '<circle class="bulb" cx="' +
              p.x +
              '" cy="' +
              p.y +
              '" r="4" fill="' +
              fill +
              '"></circle>'
          }

          var segments = ''
          for (i = 0; i < DESTINATIONS.length; i++) {
            var d = DESTINATIONS[i]
            var start = i * slice
            var end = start + slice
            var mid = start + slice / 2
            var label = polar(200, 200, 118, mid)
            segments +=
              '<g>' +
              '<path d="' +
              slicePath(200, 200, 190, start, end) +
              '" fill="' +
              d.color +
              '" stroke="#04150c" stroke-width="3"></path>' +
              '<text x="' +
              label.x +
              '" y="' +
              label.y +
              '" fill="' +
              d.text +
              '" font-size="18" font-family="system-ui,-apple-system,sans-serif" font-weight="800" text-anchor="middle" dominant-baseline="middle" transform="rotate(' +
              mid +
              ', ' +
              label.x +
              ', ' +
              label.y +
              ')">' +
              esc(d.label) +
              '</text>' +
              '</g>'
          }

          wheelEl.innerHTML =
            '<svg viewBox="0 0 400 400" role="img" aria-label="Рулетка мест">' +
            '<circle cx="200" cy="200" r="198" fill="#04150c"></circle>' +
            segments +
            '<circle cx="200" cy="200" r="190" fill="none" stroke="#ffe566" stroke-width="8"></circle>' +
            bulbs +
            '<circle cx="200" cy="200" r="44" fill="#04150c" stroke="#ffe566" stroke-width="6"></circle>' +
            '<circle cx="200" cy="200" r="28" fill="#ffe566"></circle>' +
            '<text x="200" y="206" text-anchor="middle" font-family="system-ui,-apple-system,sans-serif" font-size="12" font-weight="800" fill="#1a0d00">SPIN</text>' +
            '</svg>'
        }

        function burst(color) {
          var colors = [color, '#ffe566', '#00fff0', '#ff1493', '#b8ff00', '#fff']
          for (var i = 0; i < 28; i++) {
            var el = document.createElement('i')
            el.className = 'spark'
            var angle = Math.random() * Math.PI * 2
            var dist = 70 + Math.random() * 180
            el.style.left = '50%'
            el.style.top = '40%'
            el.style.background = colors[i % colors.length]
            el.style.setProperty('--dx', Math.cos(angle) * dist + 'px')
            el.style.setProperty('--dy', Math.sin(angle) * dist + 'px')
            fx.appendChild(el)
            ;(function (node) {
              setTimeout(function () {
                if (node.parentNode) node.parentNode.removeChild(node)
              }, 900)
            })(el)
          }
        }

        function showResult(dest) {
          resultEl.innerHTML =
            '<p class="result-kicker">ВЫПАЛО</p>' +
            '<p class="result-label" style="color:' +
            dest.color +
            '">' +
            esc(dest.label) +
            '</p>' +
            '<p class="result-tagline">' +
            esc(dest.tagline) +
            '</p>'

          history.unshift(dest)
          if (history.length > 8) history.length = 8
          historySection.hidden = false
          var list = ''
          for (var i = 0; i < history.length; i++) {
            list +=
              '<li><span class="dot" style="background:' +
              history[i].color +
              '"></span>' +
              esc(history[i].label) +
              '</li>'
          }
          historyList.innerHTML = list

          pageEl.classList.remove('flash')
          void pageEl.offsetWidth
          pageEl.classList.add('flash')
          stageEl.classList.remove('win', 'spinning')
          void stageEl.offsetWidth
          stageEl.classList.add('win')
          burst(dest.color)
        }

        function spin() {
          if (spinning) return
          spinning = true
          btn.disabled = true
          btn.textContent = 'КРУТИТСЯ…'
          stageEl.classList.add('spinning')
          stageEl.classList.remove('win')
          resultEl.innerHTML = '<p class="result-placeholder">Крутится…</p>'

          var index = Math.floor(Math.random() * DESTINATIONS.length)
          var segmentCenter = index * slice + slice / 2
          var jitter = (Math.random() - 0.5) * (slice * 0.5)
          var targetMod = (360 - segmentCenter + jitter + 360) % 360
          var currentMod = ((rotation % 360) + 360) % 360
          var delta =
            ((targetMod - currentMod + 360) % 360) +
            MIN_TURNS * 360 +
            Math.floor(Math.random() * 360)

          rotation += delta
          wheelEl.style.transition =
            'transform ' + SPIN_MS + 'ms cubic-bezier(0.1, 0.7, 0.05, 1)'
          wheelEl.style.webkitTransform = 'rotate(' + rotation + 'deg)'
          wheelEl.style.transform = 'rotate(' + rotation + 'deg)'

          setTimeout(function () {
            spinning = false
            btn.disabled = false
            btn.textContent = 'КРУТИТЬ'
            showResult(DESTINATIONS[index])
          }, SPIN_MS)
        }

        try {
          renderTicker()
          renderWheel()
          btn.addEventListener('click', spin)
        } catch (err) {
          resultEl.innerHTML =
            '<p class="result-placeholder">Ошибка загрузки. Открой файл ещё раз.</p>'
        }
      })()
    </script>
  </body>
</html>
